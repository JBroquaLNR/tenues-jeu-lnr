# Interroge la base une fois par semaine pour que le projet Supabase gratuit ne soit pas mis en pause.
# Demande deux secrets dans GitHub (Settings > Secrets and variables > Actions) : SUPABASE_URL et SUPABASE_ANON_KEY.
name: Garder la base active
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
