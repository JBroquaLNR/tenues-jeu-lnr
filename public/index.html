<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tenues de jeu LNR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bleu:#002367;--rouge:#ff004d}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background-color:var(--bleu);background-image:linear-gradient(112deg,transparent 0 56%,rgba(255,255,255,.045) 56% 70%,transparent 70% 76%,rgba(255,255,255,.03) 76% 81%,transparent 81%);color:#fff;font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 24px;box-sizing:border-box}
main{display:flex;gap:44px;align-items:center;max-width:820px;flex-wrap:wrap}
img{height:260px;width:auto;display:block}
.texte{flex:1;min-width:260px}
.surtitre{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 6px}
h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:64px;line-height:.95;text-transform:uppercase;margin:0 0 18px}
.filet{width:72px;height:6px;background:var(--rouge);margin:0 0 20px}
p{margin:0 0 12px;color:rgba(255,255,255,.82);max-width:46ch}
a.acces{display:inline-block;margin-top:10px;background:#fff;color:var(--bleu);text-decoration:none;font-weight:500;padding:10px 18px;border-radius:6px}
a.acces:focus-visible{outline:3px solid var(--rouge);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="img/lnr-logo.png" alt="Ligue Nationale de Rugby">
  <div class="texte">
    <p class="surtitre">Ligue Nationale de Rugby</p>
    <h1>Tenues de jeu</h1>
    <div class="filet"></div>
    <p>Dépôt et validation des tenues de jeu des clubs du TOP 14 et de la PRO D2.</p>
    <p>Les clubs accèdent à leur espace par le lien personnel transmis par la LNR.</p>
    <a class="acces" href="admin.html">Accès LNR</a>
  </div>
</main>
</body>
</html>
