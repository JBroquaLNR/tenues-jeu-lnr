<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Tenues de jeu LNR · Espace club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout : bandeau de saison, barre d'onglets collante, puis des « planches » blanches (comme un BAT) posées sur un fond gris froid. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#121821; --muted:#5a6573; --line:#d3d9e0;
  --accent:#1c3db8; --accent-bg:#e2e8fb; --accent-ink:#ffffff;
  --ok:#126e44; --ok-bg:#dcf0e5; --ko:#ad241c; --ko-bg:#f8dcd9; --doute:#8a5800; --doute-bg:#fbeac6;
  --planche:#ffffff; --planche-ink:#121821; --planche-line:#e3e7ec;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171c25; --surface-2:#1e2430; --ink:#e7ebf1; --muted:#98a3b3; --line:#2c3441;
  --accent:#93a6ff; --accent-bg:#1f2a52; --accent-ink:#0e1218;
  --ok:#62d19c; --ok-bg:#12352a; --ko:#ff8f85; --ko-bg:#45211e; --doute:#f1bf5e; --doute-bg:#3e3114;
  --planche:#f2f3f5; --planche-ink:#121821; --planche-line:#d9dde3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171c25; --surface-2:#1e2430; --ink:#e7ebf1; --muted:#98a3b3; --line:#2c3441;
  --accent:#93a6ff; --accent-bg:#1f2a52; --accent-ink:#0e1218;
  --ok:#62d19c; --ok-bg:#12352a; --ko:#ff8f85; --ko-bg:#45211e; --doute:#f1bf5e; --doute-bg:#3e3114;
  --planche:#f2f3f5; --planche-ink:#121821; --planche-line:#d9dde3; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Bandeau */
.top{padding-block:22px 14px;display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(34px,5vw,48px);text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.stats li.alerte b{color:var(--doute)}

/* Onglets */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;align-items:center}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--doute-bg);color:var(--doute);padding:1px 6px;border-radius:9px;margin-left:5px;vertical-align:3px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:16px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync.on::before{background:var(--ok)}

main{padding-block:22px 64px}
.view-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.view-head h2{font-size:28px;text-transform:uppercase}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#seg-comp button{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;padding:6px 16px}

.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pick{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px 5px 6px;font-weight:500}
.pick img{width:22px;height:22px;object-fit:contain}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick.j{padding:5px 9px;font-family:var(--mono);font-size:12px;min-width:40px;justify-content:center}

.thumb{background:var(--planche);border:1px solid var(--planche-line);border-radius:4px;display:grid;place-items:center;width:46px;height:46px;flex:none;overflow:hidden;color:#5a6573;font-family:var(--mono);font-size:10px}
.thumb img{max-width:88%;max-height:88%;object-fit:contain;display:block}
.kitcap{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;max-width:64px;overflow-wrap:anywhere}

/* Rencontres */
.grid-matchs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.match header{display:flex;align-items:baseline;gap:10px}
.match .j{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.match h3{font-size:20px;font-weight:600}
.match h3 small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.mx-box{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:3px;margin-inline:auto}
.mx th{font-weight:400;padding:0}
.mx thead th{vertical-align:bottom;padding-bottom:3px}
.mx .kh{display:flex;flex-direction:column;align-items:center;gap:3px}
.mx tbody th .kh{flex-direction:row;gap:6px;justify-content:flex-end}
.mx tbody th .kitcap{text-align:right;white-space:nowrap;max-width:none}
.mx .coin{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;vertical-align:bottom;padding:0 4px 6px 0;line-height:1.3}
.cell{width:58px;height:46px;border:1px solid transparent;border-radius:4px;font-size:19px;font-weight:600;position:relative;display:grid;place-items:center;padding:0}
.cell.ok{background:var(--ok-bg);color:var(--ok)}
.cell.ko{background:var(--ko-bg);color:var(--ko)}
.cell.doute{background:var(--doute-bg);color:var(--doute)}
.cell.incertain{border:1.5px dashed currentColor}
.cell.tranche::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.cell:hover{filter:brightness(.96)}
.conseil{font-size:12.5px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:9px}
.conseil b{color:var(--ink);font-weight:600}
.conseil.vide b{color:var(--ko)}
.legende{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted);margin-top:18px;align-items:center}
.legende .cell{width:26px;height:22px;font-size:13px;display:inline-grid;vertical-align:middle;margin-right:5px;cursor:default}

/* Catalogue */
.club{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.club .id{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.club .id img{width:54px;height:54px;object-fit:contain}
.club .id h3{font-size:24px}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kit{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr 74px;gap:8px 10px;align-items:center}
.kit .t{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kit .t b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.kit .t span{font-size:12px;color:#5a6573}
.kit .m{display:grid;place-items:center;height:150px}
.kit .m img{max-height:150px;max-width:100%;object-fit:contain}
.kit .sc{display:flex;flex-direction:column;gap:6px;align-items:center}
.kit .sc img{max-height:68px;max-width:74px;object-fit:contain}
.chips{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--planche-line);padding-top:8px}
.chip{display:flex;flex-direction:column;width:52px;border:1px solid #c9cfd7;background:#fff}
.chip i{display:block;height:20px}
.chip code{font-family:var(--mono);font-size:9px;padding:2px 3px;color:#121821;line-height:1.25}

/* Listes, pastilles, boutons */
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.liste{display:flex;flex-direction:column;gap:8px}
.ligne{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.duo{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;min-width:0}
.duo .k{display:flex;gap:8px;align-items:center;min-width:0}
.duo .k b{display:block;font-weight:600}
.duo .k span{font-size:12px;color:var(--muted)}
.duo .vs{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px}
.raisons{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0}
.pill.conflit,.pill.ko{background:var(--ko-bg);color:var(--ko);border-color:transparent}
.pill.incertain,.pill.doute{background:var(--doute-bg);color:var(--doute);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ko{border-color:var(--ko);color:var(--ko)}
.btn.doute{border-color:var(--doute);color:var(--doute)}
.btn.actif.ok{background:var(--ok);color:var(--surface)}
.btn.actif.ko{background:var(--ko);color:var(--surface)}
.btn.actif.doute{background:var(--doute);color:var(--surface)}
.btn.plein{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lien{border:0;background:none;color:var(--muted);text-decoration:underline;padding-inline:4px}
.btn[disabled]{opacity:.5;cursor:default}
.vide-etat{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;max-width:70ch}

/* Suivi */
.compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.compteurs div{background:var(--surface);padding:12px 14px}
.compteurs b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.compteurs span{font-size:12px;color:var(--muted)}
.compteurs .ko b{color:var(--ko)} .compteurs .ok b{color:var(--ok)} .compteurs .doute b{color:var(--doute)}
.bloc-club{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.bloc-club>header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bloc-club>header img{width:34px;height:34px;object-fit:contain}
.bloc-club>header h3{font-size:22px}
.bloc-club .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px;flex:1;min-width:180px}
.bloc-club .meta b{color:var(--ink);font-weight:500}
.tbox{overflow-x:auto}
table.suivi{border-collapse:collapse;width:100%;min-width:680px}
table.suivi th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 14px 6px}
table.suivi td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.suivi td.t{display:flex;gap:10px;align-items:center;font-weight:600}
table.suivi td small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.suivi tr.attendu td{color:var(--muted)}

/* Dossier */
.fil{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.dossier{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"bat coul" "part part" "valid hist";gap:16px;align-items:start}
.z-bat{grid-area:bat}.z-coul{grid-area:coul}.z-part{grid-area:part}.z-valid{grid-area:valid}.z-hist{grid-area:hist}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.carte>h3{font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:contents}
.bat{background:var(--planche);border:1px solid var(--planche-line);border-radius:6px;overflow:auto;max-height:560px;display:grid;place-items:center;min-height:120px;color:#5a6573;font-size:13px;padding:6px}
.bat canvas{max-width:100%;height:auto;cursor:crosshair;display:block}
.versions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.versions li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.versions b{font-family:var(--mono);font-weight:500}
.rang{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.champ{display:flex;align-items:center;justify-content:space-between;gap:10px}
.champ.v{flex-direction:column;align-items:stretch;gap:3px}
.champ.v>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],textarea,select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=color]{width:46px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;flex:none}
.apercu-tenue{background:var(--planche);border:1px solid var(--planche-line);border-radius:6px;padding:10px;display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px;align-items:center;justify-items:center}
.apercu-tenue canvas{max-width:100%;height:auto;max-height:150px}
table.cdc{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
table.cdc th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:4px 6px}
table.cdc td{padding:3px 6px;border-top:1px solid var(--line)}
table.cdc td.e{white-space:nowrap;font-weight:500}
table.cdc input,table.cdc select{padding:4px 6px}
table.cdc td:nth-child(2){min-width:170px}table.cdc td:nth-child(3),table.cdc td:nth-child(4){min-width:150px}
table.cdc .dim{display:flex;gap:4px;align-items:center}
table.cdc .dim input{width:56px}
table.cdc .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.cdc tr.zone td{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bilan{display:flex;flex-direction:column;gap:6px}
.bilan ul{margin:0;padding-left:18px;color:var(--ko)}
.valid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.valid section{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.valid h4{font-size:17px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mail{border:1px solid var(--accent);background:var(--accent-bg);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mail textarea{min-height:170px;font-size:13px}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.journal li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px}
.journal time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
details img{margin-top:8px;border:1px solid var(--planche-line);border-radius:4px;background:#fff}

/* Dialogue */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,12,18,.55)}
.fiche{padding:20px;display:flex;flex-direction:column;gap:16px}
.fiche h3{font-size:26px;text-transform:uppercase}
.fiche .faces{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.face{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.face img{height:130px;max-width:100%;object-fit:contain}
.face b{font-weight:600;text-align:center}
.face span{font-size:12px;color:#5a6573;text-align:center}
.face .chips{border:0;padding:0;justify-content:center}
.jauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok-bg) 0 var(--b1),var(--doute-bg) var(--b1) var(--b2),var(--ko-bg) var(--b2) 100%);border:1px solid var(--line)}
.jauge i{position:absolute;top:-5px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.faits{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.faits dt{color:var(--muted)}
.faits dd{margin:0}
.fiche .actions{justify-content:flex-start}
.fiche footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}

/* Générateur */
.gen{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.panneau{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panneau fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.panneau legend{font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:0;margin-bottom:4px}
.panneau .champ select{max-width:190px}
.planche{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:8px;padding:18px;display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:14px;align-items:center;justify-items:center}
.planche canvas{max-width:100%;height:auto;max-height:340px}
.planche figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.planche figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#5a6573}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:900px){ .dossier{grid-template-columns:minmax(0,1fr);grid-template-areas:"bat" "coul" "part" "valid" "hist"} }
@media (max-width:720px){
  .club{grid-template-columns:1fr}
  .club .id{flex-direction:row;align-items:center}
  .gen{grid-template-columns:1fr}
  .ligne{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .sync{display:none}
}
@media (max-width:420px){
  .cell{width:50px;height:42px}
  .thumb{width:40px;height:40px}
  .fiche .faces{grid-template-columns:1fr}
  .planche{grid-template-columns:1fr}
  .journal li{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:no-preference){ .cell,.btn,.pick{transition:filter .12s,background-color .12s} }

/* Connexion, bandeau de session */
.session{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-block:8px 0}
.session input{width:150px;padding:4px 8px}
.connexion{max-width:380px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.connexion h2{font-size:26px;text-transform:uppercase}
.connexion .err{color:var(--ko);margin:0;font-size:13px}
.bandeau{background:var(--doute-bg);color:var(--doute);border-radius:6px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.pastille{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);padding:0}
.pied{color:var(--muted);font-size:12px;padding-block:0 28px}

/* Espace club */
.entete{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-block:22px 16px}
.entete img{width:64px;height:64px;object-fit:contain}
.entete h1{font-size:clamp(30px,5vw,44px);text-transform:uppercase}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.tenue{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tenue h3{font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tenue h3 small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none}
.tenue .vis{background:var(--planche);border:1px solid var(--planche-line);border-radius:6px;height:150px;display:grid;place-items:center;color:#5a6573;font-size:13px}
.tenue .vis img{max-height:136px;max-width:90%;object-fit:contain}
.etats{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px;align-items:center}
.etats dt{color:var(--muted)} .etats dd{margin:0}
.demande{background:var(--ko-bg);color:var(--ko);border-radius:6px;padding:8px 10px;font-size:13px;margin:0}
.etapes{display:flex;flex-direction:column;gap:16px}
.etape>h3 .num{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.envoi{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="entete" id="entete"><div><div class="eyebrow">LNR · Tenues de jeu</div><h1>Espace club</h1></div></header>
  <main id="main"><p class="vide-etat">Chargement…</p></main>
  <footer class="pied" style="padding-top:28px">Tenues de jeu LNR · V0.2.0</footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="commun.js"></script>
<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const {num,fmt,EMPL,ZONES,CDC,controle,DEFAUT,MOTIF_LIB,MOTIFS,GAB,chargerGabarits,peindre,detecter,alleger,rasteriser,nettoyerPubs}=window.LNR;
const ATTENDU={"TOP 14":3,"PRO D2":2}, SUFF=["dom","ext","third"];
const dateFr=iso=>{const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});};
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||"");
let D=null, store=null, jeton="", club=null, docs={}, vue="accueil", depot=null, pipette="m1", envoiEnCours=false;
let tTimer; function toast(t){const e=$("#toast"); e.textContent=t; e.hidden=false; clearTimeout(tTimer); tTimer=setTimeout(()=>e.hidden=true,6500);}

/* ---------- Accès aux données : uniquement par le lien du club ---------- */
function storeSupabase(url,cle){
  const sb=window.supabase.createClient(url,cle,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}), ok=r=>{ if(r.error) throw r.error; return r.data; };
  return { mode:"supabase",
    async espace(j){ return ok(await sb.rpc("club_espace",{p_jeton:j})); },
    async deposerImage(chemin,blob){ ok(await sb.storage.from("bat").upload(chemin,blob,{contentType:"image/jpeg",upsert:false})); },
    async deposer(j,tenue,d,chemin,nom){ return ok(await sb.rpc("club_deposer",{p_jeton:j,p_tenue:tenue,p_couleurs:d.couleurs,p_equip:d.equip,p_pubs:d.pubs,p_chemin:chemin,p_nom:nom})); } };
}
function storeLocal(){
  const CLE="tenues-lnr.demo"; const lire=()=>{ let b={decisions:{},clubs:{},tenues:{},liens:{}}; try{ b=Object.assign(b,JSON.parse(localStorage.getItem(CLE)||"{}")); }catch(_){ } return b; };
  const clubDe=(b,j)=>Object.keys(b.liens).find(c=>b.liens[c]===j)||null;
  return { mode:"local",
    async espace(j){ const b=lire(), c=clubDe(b,j); if(!c) return null; const t={}; for(const id in b.tenues) if(b.tenues[id].club===c){ const d=b.tenues[id]; t[id]={type:d.type,ordre:d.ordre,couleurs:d.couleurs,equip:d.equip,pubs:d.pubs,design:d.design,part:d.part,versions:(d.versions||[]).map(v=>({n:v.n,le:v.le,nom:v.nom}))}; }
      return {club:c,fiche:b.clubs[c]||null,tenues:t}; },
    async deposerImage(){},
    async deposer(j,tenue,d,chemin,nom){ const b=lire(), c=clubDe(b,j); if(!c) throw new Error("lien inconnu"); const id=c+"."+tenue, o=SUFF.indexOf(tenue), ordre=o>=0?o:+tenue.slice(1)-1;
      const doc=b.tenues[id]||{club:c,ordre,type:["Domicile","Extérieur"][ordre]||"Tenue "+(ordre+1)}; delete doc.design; delete doc.part;
      const n=((doc.versions||[]).slice(-1)[0]||{n:0}).n+1, le=new Date().toISOString(), np=Object.keys(d.pubs).length;
      Object.assign(doc,{couleurs:d.couleurs,equip:d.equip,pubs:d.pubs}); doc.versions=(doc.versions||[]).concat([{n,asset:chemin,nom,type:"image/jpeg",le,par:"Club"}]);
      doc.journal=(doc.journal||[]).concat([{le,par:"Club",x:`Dépôt du club : BAT V${n}, ${np} partenaire${np>1?"s":""} déclaré${np>1?"s":""}`}]);
      b.tenues[id]=doc; try{ localStorage.setItem(CLE,JSON.stringify(b)); }catch(_){ } return {tenue:id,version:n}; } };
}

/* ---------- Les tenues du club : catalogue + dépôts + tenues attendues ---------- */
function tenues(){
  const stat=(D.clubs.find(c=>c.id===club.id)||{tenues:[]}).tenues, out=[], vus={};
  stat.forEach((k,i)=>{ const suff=k.id.split(".").pop(); out.push({suff,type:k.type,ordre:i,statique:k,doc:docs[k.id]||{}}); vus[k.id]=1; });
  for(const id in docs){ if(vus[id]) continue; const d=docs[id], suff=id.split(".").pop(); out.push({suff,type:d.type||"Tenue",ordre:d.ordre==null?9:d.ordre,doc:d}); vus[id]=1; }
  const n=ATTENDU[club.comp]||2;
  for(let i=0;i<n;i++){ if(out.some(t=>t.ordre===i)) continue; out.push({suff:SUFF[i],type:["Domicile","Extérieur",club.comp==="TOP 14"?"Third":"Tenue 3"][i],ordre:i,doc:{},attendu:true}); }
  return out.sort((a,b)=>a.ordre-b.ordre);
}
const versions=T=>T.doc.versions||[];
function etatDesign(T){ const s=T.doc.design&&T.doc.design.statut; if(s) return s; if(T.statique&&!versions(T).length) return "valide"; return versions(T).length?"recu":"attendu"; }
function etatPart(T){ const s=T.doc.part&&T.doc.part.statut; if(s) return s; if(versions(T).length) return "recu"; return T.statique?"nonsaisi":"attendu"; }
const PILL={attendu:["doute","À déposer"],recu:["info","Reçu, en cours d'examen"],valide:["ok","Validé"],corriger:["ko","À corriger"],nonsaisi:["","Non communiqués"]};
const pill=s=>`<span class="pill ${PILL[s][0]}">${PILL[s][1]}</span>`;
const vigCache={};
function vignette(co){ if(!co||!hexOk(co.m1)||!GAB.pret) return ""; const k=[co.m1,co.m2,co.motif].join(","); if(vigCache[k]) return vigCache[k]; const cv=document.createElement("canvas"); peindre(cv,"maillot",co); try{ return vigCache[k]=cv.toDataURL("image/png"); }catch(e){ return ""; } }

function vueAccueil(){
  const ts=tenues(), aFaire=ts.filter(T=>etatDesign(T)==="attendu"||etatDesign(T)==="corriger"||etatPart(T)==="corriger").length;
  const libres=["third","t4","t5","t6","t7","t8","t9"].filter(s=>!ts.some(T=>T.suff===s));
  return `<div class="view-head"><div><h2>Vos tenues ${esc(D.saison)}</h2><p>${aFaire?`${aFaire} tenue${aFaire>1?"s":""} en attente d'une action de votre part.`:"Aucune action attendue de votre part pour le moment."} Chaque dépôt comprend le BAT (une page par tenue), les couleurs et la grille des partenaires.</p></div>
    ${libres.length?`<button class="btn" data-deposer="${libres[0]}">Ajouter une tenue supplémentaire</button>`:""}</div>
  <div class="cartes">${ts.map(T=>{ const d=etatDesign(T), p=etatPart(T), v=versions(T).slice(-1)[0], img=T.statique&&!versions(T).length?T.statique.maillot.img:vignette(T.doc.couleurs);
    const dem=["design","part"].filter(k=>T.doc[k]&&T.doc[k].statut==="corriger"&&T.doc[k].com).map(k=>`<p class="demande"><b>${k==="design"?"Design":"Partenaires"} :</b> ${esc(T.doc[k].com)}</p>`).join("");
    return `<article class="tenue"><h3>${esc(T.type)}<small>${v?`BAT V${v.n} déposé le ${dateFr(v.le)}`:T.statique?"Au catalogue":"Aucun dépôt"}</small></h3>
      <div class="vis">${img?`<img src="${img}" alt="">`:"Pas encore de visuel"}</div>
      <dl class="etats"><dt>Design</dt><dd>${pill(d)}</dd><dt>Partenaires</dt><dd>${pill(p)}</dd></dl>${dem}
      <button class="btn ${d==="attendu"||d==="corriger"||p==="corriger"?"plein":""}" data-deposer="${T.suff}">${v?"Déposer une nouvelle version":T.statique?"Déposer le BAT":"Déposer cette tenue"}</button></article>`; }).join("")}</div>
  <p class="note" style="margin-top:18px">Un nouveau dépôt remplace la saisie précédente et relance l'examen par la LNR. Conservez vos fichiers d'origine : seule une image allégée du BAT est transmise.</p>`;
}

/* ---------- Dépôt d'une tenue ---------- */
function ouvrirDepot(suff){
  const T=tenues().find(t=>t.suff===suff), o=SUFF.indexOf(suff), ordre=o>=0?o:+suff.slice(1)-1;
  const type=T?T.type:(ordre===2?(club.comp==="TOP 14"?"Third":"Tenue 3"):"Tenue "+(ordre+1)), d=T?T.doc:{};
  depot={suff,type,couleurs:Object.assign({},DEFAUT,{nom:""},d.couleurs||{}),equip:Object.assign({nom:"",manches:"",short:"",maillot:""},d.equip||{}),pubs:JSON.parse(JSON.stringify(d.pubs||{})),canvas:null,nom:"",pages:1,teintes:null,couleurChoisie:!!(d.couleurs&&d.couleurs.m1)};
  vue="depot"; rendre(); window.scrollTo(0,0);
}
function ligneCdc(s){
  const p=depot.pubs[s.id]||{};
  return `<tr data-slot="${s.id}"><td class="e">${s.lab}</td>
    <td>${s.pos?`<select data-pub="pos" aria-label="Position"><option value=""></option>${s.pos.map(o=>`<option ${p.pos===o?"selected":""}>${o}</option>`).join("")}</select>`:""}</td>
    <td><input type="text" data-pub="nom" value="${esc(p.nom)}" maxlength="80" aria-label="Partenaire"></td>
    <td><input type="text" data-pub="secteur" value="${esc(p.secteur)}" maxlength="60" aria-label="Secteur d'activité"></td>
    <td><span class="dim"><input type="text" inputmode="decimal" data-pub="l" value="${esc(p.l)}" aria-label="Largeur en cm">×<input type="text" inputmode="decimal" data-pub="h" value="${esc(p.h)}" aria-label="Hauteur en cm"></span></td>
    <td class="num" data-surf></td><td class="num">${s.max}</td><td data-etat></td></tr>`;
}
function majCdc(){
  const c=controle(depot.pubs);
  $$("table.cdc tr[data-slot]").forEach(tr=>{const l=c.lignes[tr.dataset.slot]; $("[data-surf]",tr).textContent=l&&l.a?fmt(l.a):""; $("[data-etat]",tr).innerHTML=!l?"":l.ok?`<span class="pill ok">✓</span>`:`<span class="pill ko">✕</span>`;});
  const b=$("#cdc-bilan"); if(b) b.innerHTML=`<div class="rang"><span class="pill ${c.n>CDC.pubs?"ko":""}">${c.n} publicité${c.n>1?"s":""} sur ${CDC.pubs}</span><span class="pill ${c.tot.avant>CDC.avant?"ko":""}">Devant : ${fmt(c.tot.avant)} / ${CDC.avant} cm²</span><span class="pill ${c.tot.dos>CDC.dos?"ko":""}">Dos : ${fmt(c.tot.dos)} / ${CDC.dos} cm²</span>
    ${!c.n?"":c.anomalies.length?`<span class="pill ko">${c.anomalies.length} écart${c.anomalies.length>1?"s":""} au cahier des charges</span>`:`<span class="pill ok">Conforme au cahier des charges</span>`}</div>${c.anomalies.length?`<ul>${c.anomalies.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}`;
  majEnvoi();
}
function majEnvoi(){
  const b=$("#b-envoyer"), m=$("#m-envoi"); if(!b) return; const manque=[];
  if(!depot.canvas) manque.push("le BAT"); if(!depot.couleurChoisie) manque.push("la couleur principale du maillot");
  b.disabled=!!manque.length||envoiEnCours; b.textContent=envoiEnCours?"Envoi en cours…":"Envoyer à la LNR";
  const an=controle(depot.pubs).anomalies.length;
  m.textContent=manque.length?`Il manque ${manque.join(" et ")}.`:an?`Votre grille présente ${an} écart${an>1?"s":""} au cahier des charges. Vous pouvez l'envoyer telle quelle : la LNR vous répondra.`:"Votre dépôt est prêt.";
}
function dessinerApercu(){ if(!GAB.pret) return; for(const p of ["maillot","short","chaussettes"]){ const cv=$("#ap-"+p); if(cv) peindre(cv,p,depot.couleurs); } }
function vueDepot(){
  const co=depot.couleurs, eq=depot.equip;
  const col=(id,l)=>`<label class="champ" for="d-${id}">${l}<input type="color" id="d-${id}" data-co="${id}" value="${esc(hexOk(co[id])?co[id]:"#ffffff")}"></label>`;
  const on=(id,l)=>`<label class="champ v" for="eq-${id}"><span>${l}</span><select id="eq-${id}" data-eq="${id}"><option value=""></option><option ${eq[id]==="oui"?"selected":""}>oui</option><option ${eq[id]==="non"?"selected":""}>non</option></select></label>`;
  const cibles=`<option value="m1">Maillot, principale</option><option value="m2">Maillot, secondaire</option><option value="s1">Short</option><option value="c1">Chaussettes</option><option value="c2">Chaussettes, revers</option>`;
  let zone=""; const lignes=EMPL.map(s=>{const z=s.zone!==zone?`<tr class="zone"><td colspan="8">${ZONES[s.zone]}</td></tr>`:""; zone=s.zone; return z+ligneCdc(s);}).join("");
  return `<div class="fil"><button class="btn petit" data-retour>← Vos tenues</button></div>
  <div class="view-head"><div><h2>Dépôt · ${esc(depot.type)}</h2><p>Trois étapes, puis l'envoi. Rien n'est transmis à la LNR tant que vous n'avez pas cliqué sur « Envoyer ».</p></div></div>
  <div class="etapes">
    <section class="carte etape"><h3><span>Le BAT</span><span class="num">ÉTAPE 1 SUR 3</span></h3>
      <div class="rang"><label class="btn plein" for="f-bat">${depot.canvas?"Changer de fichier":"Choisir le fichier du BAT"}</label><input type="file" id="f-bat" accept="application/pdf,image/png,image/jpeg,image/webp" hidden>${depot.nom?`<span class="note" style="margin:0">${esc(depot.nom)}</span>`:""}</div>
      <p class="note" style="margin:0">PDF ou image, une page par tenue. ${depot.pages>1?`<b>Votre PDF compte ${depot.pages} pages : seule la première est prise en compte.</b>`:"Si votre PDF contient plusieurs pages, seule la première est prise en compte."}</p>
      <div class="bat" id="bat" ${depot.canvas?"":"hidden"}></div>
      <div class="rang" ${depot.canvas?"":"hidden"}><label class="champ" for="s-pipette" style="gap:8px">Pipette : un clic sur le BAT envoie la couleur vers<select id="s-pipette" style="width:auto">${cibles}</select></label></div>
    </section>
    <section class="carte etape"><h3><span>Les couleurs</span><span class="num">ÉTAPE 2 SUR 3</span></h3>
      <div class="apercu-tenue"><canvas id="ap-maillot" width="354" height="420" role="img" aria-label="Aperçu du maillot"></canvas><canvas id="ap-short" width="420" height="342" role="img" aria-label="Aperçu du short"></canvas><canvas id="ap-chaussettes" width="321" height="420" role="img" aria-label="Aperçu des chaussettes"></canvas></div>
      <div id="z-teintes" ${depot.teintes?"":"hidden"}><div class="rang"><span class="note" style="margin:0">Couleurs détectées sur votre BAT. Un clic l'envoie vers</span><select id="s-cible" style="width:auto" aria-label="Pièce à colorer">${cibles}</select></div>
        <div class="rang" style="margin-top:8px">${(depot.teintes||[]).map(h=>`<button class="pastille" data-teinte="${h}" style="background:${h}" title="${h.toUpperCase()}" aria-label="Utiliser la couleur ${h.toUpperCase()}"></button>`).join("")}</div></div>
      <div class="champs">${col("m1","Maillot, principale")}${col("m2","Maillot, secondaire")}${col("s1","Short")}${col("c1","Chaussettes")}${col("c2","Chaussettes, revers")}
        <label class="champ v" for="d-motif"><span>Motif du maillot</span><select id="d-motif" data-co="motif">${MOTIF_LIB.map(o=>`<option value="${o[0]}" ${co.motif===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>
        <label class="champ v" for="d-nom"><span>Désignation (ex. jaune / marine)</span><input type="text" id="d-nom" data-co="nom" maxlength="60" value="${esc(co.nom)}"></label></div>
      <p class="note" style="margin:0">Ces couleurs servent à vérifier la compatibilité de votre tenue avec celles de vos adversaires. L'aperçu est volontairement simplifié.</p>
    </section>
    <section class="carte etape"><h3><span>Les partenaires</span><span class="num">ÉTAPE 3 SUR 3</span></h3>
      <div class="champs"><label class="champ v" for="eq-nom"><span>Équipementier</span><input type="text" id="eq-nom" data-eq="nom" maxlength="60" value="${esc(eq.nom)}"></label>${on("manches","Logo sur les manches")}${on("short","Logo sur le short")}${on("maillot","Logo sur le maillot")}</div>
      <p class="note" style="margin:0">Une ligne par publicité présente sur la tenue, avec ses dimensions en centimètres. Les plafonds du cahier des charges sont contrôlés au fil de la saisie.</p>
      <div class="tbox"><table class="cdc"><thead><tr><th>Emplacement</th><th>Position</th><th>Partenaire</th><th>Secteur</th><th>L × H (cm)</th><th>cm²</th><th>Plafond</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
      <div class="bilan" id="cdc-bilan"></div>
      <details><summary>Voir le schéma des emplacements</summary><img src="img/schema-emplacements.png" alt="Schéma des quatorze emplacements publicitaires sur le maillot et le short" loading="lazy"></details>
    </section>
    <div class="envoi"><span id="m-envoi"></span><button class="btn plein" id="b-envoyer" disabled>Envoyer à la LNR</button></div>
  </div>`;
}
function apresDepot(){
  if(depot.canvas){ const cv=document.createElement("canvas"); cv.width=depot.canvas.width; cv.height=depot.canvas.height; cv.getContext("2d").drawImage(depot.canvas,0,0); cv.id="cv-bat"; cv.setAttribute("role","img"); cv.setAttribute("aria-label","Votre BAT"); $("#bat").appendChild(cv); }
  const a=$("#s-pipette"), b=$("#s-cible"); if(a) a.value=pipette; if(b) b.value=pipette;
  chargerGabarits().then(dessinerApercu).catch(()=>{}); majCdc();
}
async function choisirFichier(f){
  try{ const r=await rasteriser(f,f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"")); depot.canvas=r.canvas; depot.nom=f.name; depot.pages=r.pages||1; depot.teintes=detecter(r.canvas); rendre(); }
  catch(e){ toast("Ce fichier n'a pas pu être ouvert. Choisissez un PDF ou une image (PNG, JPEG, WebP)."); }
}
function poserCouleur(k,h){ depot.couleurs[k]=h; if(k==="m1") depot.couleurChoisie=true; const i=$("#d-"+k); if(i) i.value=h; dessinerApercu(); majEnvoi(); }
async function envoyer(){
  if(envoiEnCours||!depot.canvas) return; envoiEnCours=true; majEnvoi();
  try{
    const blob=await alleger(depot.canvas), chemin=`clubs/${jeton}/${depot.suff}-${Date.now()}.jpg`;
    await store.deposerImage(chemin,blob);
    const co={}; for(const k of ["m1","m2","s1","c1","c2"]) if(hexOk(depot.couleurs[k])) co[k]=depot.couleurs[k]; co.motif=depot.couleurs.motif||"uni"; co.nom=(depot.couleurs.nom||"").slice(0,60);
    const pubs=nettoyerPubs(depot.pubs); for(const k in pubs){ for(const c of ["l","h"]) pubs[k][c]=pubs[k][c]===""?"":String(Math.min(999,Math.round(pubs[k][c]*100)/100)); }
    const r=await store.deposer(jeton,depot.suff,{couleurs:co,equip:depot.equip,pubs},chemin,depot.nom.slice(0,120));
    await charger(); envoiEnCours=false; vue="accueil"; depot=null; rendre(); window.scrollTo(0,0);
    toast(`Dépôt envoyé à la LNR${r&&r.version?" (version "+r.version+")":""}. Vous serez informé de la suite sur cette page.`);
  }catch(e){ envoiEnCours=false; majEnvoi(); const m=e&&e.message||"";
    toast(/lien inconnu|row-level|policy/i.test(m)?"Ce lien n'est plus valide. Demandez un nouveau lien à la LNR.":/exceeded|too large|size/i.test(m)?"L'image du BAT est trop lourde. Exportez votre BAT avec une définition plus faible.":"L'envoi a échoué. Vérifiez votre connexion et réessayez : votre saisie est conservée sur cette page."); }
}

/* ---------- Rendu et événements ---------- */
function rendre(){
  $("#main").innerHTML=vue==="depot"?vueDepot():vueAccueil();
  if(vue==="depot") apresDepot();
}
document.addEventListener("click",e=>{
  if(e.target.id==="cv-bat"&&depot){ const cv=e.target, r=cv.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)*cv.width/r.width), y=Math.floor((e.clientY-r.top)*cv.height/r.height);
    try{ const p=cv.getContext("2d").getImageData(x,y,1,1).data, hex="#"+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,"0")).join(""); poserCouleur(pipette,hex); toast(`Couleur ${hex.toUpperCase()} relevée.`);}catch(_){ } return; }
  const t=e.target.closest("button"); if(!t) return; const ds=t.dataset;
  if(ds.deposer) return ouvrirDepot(ds.deposer);
  if("retour" in ds){ vue="accueil"; depot=null; rendre(); return window.scrollTo(0,0); }
  if(ds.teinte&&depot) return poserCouleur(pipette,ds.teinte);
  if(t.id==="b-envoyer") return envoyer();
});
document.addEventListener("input",e=>{
  const t=e.target, ds=t.dataset||{}; if(!depot) return;
  if(ds.co){ depot.couleurs[ds.co]=t.value; if(ds.co==="m1") depot.couleurChoisie=true; dessinerApercu(); return majEnvoi(); }
  if(ds.eq){ depot.equip[ds.eq]=t.value; return; }
  if(ds.pub){ const tr=t.closest("tr[data-slot]"); if(!tr) return; const s=tr.dataset.slot; depot.pubs[s]=depot.pubs[s]||{}; depot.pubs[s][ds.pub]=t.value; return majCdc(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="s-pipette"||t.id==="s-cible"){ pipette=t.value; const a=$("#s-pipette"), b=$("#s-cible"); if(a) a.value=pipette; if(b) b.value=pipette; }
  if(t.id==="f-bat"&&t.files&&t.files[0]) choisirFichier(t.files[0]);
});
window.addEventListener("beforeunload",e=>{ if(vue==="depot"&&depot&&(depot.canvas||Object.keys(depot.pubs).length)){ e.preventDefault(); e.returnValue=""; } });

/* ---------- Démarrage ---------- */
async function charger(){
  const r=await store.espace(jeton); if(!r) return false;
  const cat=D.clubs.find(c=>c.id===r.club), f=r.fiche||{};
  club=cat?{id:cat.id,nom:cat.nom,comp:cat.comp,logo:cat.logo}:{id:r.club,nom:String(f.nom||"Votre club"),comp:String(f.comp||"PRO D2"),logo:""};
  docs={}; for(const id in (r.tenues||{})){ const d=r.tenues[id]||{}; if(d.couleurs&&typeof d.couleurs==="object"){ for(const k of ["m1","m2","s1","c1","c2"]) if(d.couleurs[k]!=null&&!hexOk(d.couleurs[k])) delete d.couleurs[k]; if(!MOTIFS[d.couleurs.motif]) d.couleurs.motif="uni"; } else delete d.couleurs; docs[id]=d; }
  return true;
}
function refus(titre,texte){ $("#main").innerHTML=`<div class="vide-etat"><h2 style="font-size:24px;margin-bottom:8px">${titre}</h2>${texte}</div>`; }
async function demarrer(){
  jeton=(location.hash||"").slice(1).trim();
  if(!/^[0-9a-f-]{36}$/i.test(jeton)) return refus("Lien incomplet","Ouvrez cette page avec le lien personnel transmis à votre club par la LNR.");
  try{ D=await (await fetch("data.json")).json(); }catch(e){ return refus("Page indisponible","Rechargez la page dans un instant."); }
  const cfg=window.TENUES_CONFIG||{}, pret=/^https:\/\/.+/.test(cfg.SUPABASE_URL||"")&&(cfg.SUPABASE_ANON_KEY||"").length>20&&window.supabase;
  store=pret?storeSupabase(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):storeLocal();
  let ok=false; try{ ok=await charger(); }catch(e){ return refus("Page indisponible","La connexion à la LNR n'a pas abouti. Rechargez la page dans un instant."); }
  if(!ok) return refus("Lien non reconnu","Ce lien n'est pas ou plus valide. Demandez un nouveau lien à la LNR.");
  $("#entete").innerHTML=`${club.logo?`<img src="${club.logo}" alt="">`:""}<div><div class="eyebrow">LNR · Tenues de jeu · ${esc(club.comp)}</div><h1>${esc(club.nom)}</h1></div>`;
  document.title=`Tenues de jeu · ${club.nom}`;
  rendre(); chargerGabarits().then(()=>{ if(vue==="accueil") rendre(); }).catch(()=>{});
}
window.addEventListener("hashchange",()=>location.reload());
demarrer();
})();
</script>
