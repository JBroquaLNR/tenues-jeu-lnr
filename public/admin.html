<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tenues de jeu LNR · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout : bandeau de saison, barre d'onglets collante, puis des « planches » blanches (comme un BAT) posées sur un fond gris froid. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#121821; --muted:#5a6573; --line:#d3d9e0;
  --accent:#1c3db8; --accent-bg:#e2e8fb; --accent-ink:#ffffff;
  --ok:#126e44; --ok-bg:#dcf0e5; --ko:#ad241c; --ko-bg:#f8dcd9; --doute:#8a5800; --doute-bg:#fbeac6;
  --planche:#ffffff; --planche-ink:#121821; --planche-line:#e3e7ec;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171c25; --surface-2:#1e2430; --ink:#e7ebf1; --muted:#98a3b3; --line:#2c3441;
  --accent:#93a6ff; --accent-bg:#1f2a52; --accent-ink:#0e1218;
  --ok:#62d19c; --ok-bg:#12352a; --ko:#ff8f85; --ko-bg:#45211e; --doute:#f1bf5e; --doute-bg:#3e3114;
  --planche:#f2f3f5; --planche-ink:#121821; --planche-line:#d9dde3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171c25; --surface-2:#1e2430; --ink:#e7ebf1; --muted:#98a3b3; --line:#2c3441;
  --accent:#93a6ff; --accent-bg:#1f2a52; --accent-ink:#0e1218;
  --ok:#62d19c; --ok-bg:#12352a; --ko:#ff8f85; --ko-bg:#45211e; --doute:#f1bf5e; --doute-bg:#3e3114;
  --planche:#f2f3f5; --planche-ink:#121821; --planche-line:#d9dde3; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Bandeau */
.top{padding-block:22px 14px;display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(34px,5vw,48px);text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.stats li.alerte b{color:var(--doute)}

/* Onglets */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;align-items:center}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--doute-bg);color:var(--doute);padding:1px 6px;border-radius:9px;margin-left:5px;vertical-align:3px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:16px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync.on::before{background:var(--ok)}

main{padding-block:22px 64px}
.view-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.view-head h2{font-size:28px;text-transform:uppercase}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#seg-comp button{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;padding:6px 16px}

.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pick{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px 5px 6px;font-weight:500}
.pick img{width:22px;height:22px;object-fit:contain}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick.j{padding:5px 9px;font-family:var(--mono);font-size:12px;min-width:40px;justify-content:center}

.thumb{background:var(--planche);border:1px solid var(--planche-line);border-radius:4px;display:grid;place-items:center;width:46px;height:46px;flex:none;overflow:hidden;color:#5a6573;font-family:var(--mono);font-size:10px}
.thumb img{max-width:88%;max-height:88%;object-fit:contain;display:block}
.kitcap{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;max-width:64px;overflow-wrap:anywhere}

/* Rencontres */
.grid-matchs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.match header{display:flex;align-items:baseline;gap:10px}
.match .j{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.match h3{font-size:20px;font-weight:600}
.match h3 small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.mx-box{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:3px;margin-inline:auto}
.mx th{font-weight:400;padding:0}
.mx thead th{vertical-align:bottom;padding-bottom:3px}
.mx .kh{display:flex;flex-direction:column;align-items:center;gap:3px}
.mx tbody th .kh{flex-direction:row;gap:6px;justify-content:flex-end}
.mx tbody th .kitcap{text-align:right;white-space:nowrap;max-width:none}
.mx .coin{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;vertical-align:bottom;padding:0 4px 6px 0;line-height:1.3}
.cell{width:58px;height:46px;border:1px solid transparent;border-radius:4px;font-size:19px;font-weight:600;position:relative;display:grid;place-items:center;padding:0}
.cell.ok{background:var(--ok-bg);color:var(--ok)}
.cell.ko{background:var(--ko-bg);color:var(--ko)}
.cell.doute{background:var(--doute-bg);color:var(--doute)}
.cell.incertain{border:1.5px dashed currentColor}
.cell.tranche::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.cell:hover{filter:brightness(.96)}
.conseil{font-size:12.5px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:9px}
.conseil b{color:var(--ink);font-weight:600}
.conseil.vide b{color:var(--ko)}
.legende{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted);margin-top:18px;align-items:center}
.legende .cell{width:26px;height:22px;font-size:13px;display:inline-grid;vertical-align:middle;margin-right:5px;cursor:default}

/* Catalogue */
.club{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.club .id{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.club .id img{width:54px;height:54px;object-fit:contain}
.club .id h3{font-size:24px}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kit{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr 74px;gap:8px 10px;align-items:center}
.kit .t{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kit .t b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.kit .t span{font-size:12px;color:#5a6573}
.kit .m{display:grid;place-items:center;height:150px}
.kit .m img{max-height:150px;max-width:100%;object-fit:contain}
.kit .sc{display:flex;flex-direction:column;gap:6px;align-items:center}
.kit .sc img{max-height:68px;max-width:74px;object-fit:contain}
.chips{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--planche-line);padding-top:8px}
.chip{display:flex;flex-direction:column;width:52px;border:1px solid #c9cfd7;background:#fff}
.chip i{display:block;height:20px}
.chip code{font-family:var(--mono);font-size:9px;padding:2px 3px;color:#121821;line-height:1.25}

/* Listes, pastilles, boutons */
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.liste{display:flex;flex-direction:column;gap:8px}
.ligne{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.duo{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;min-width:0}
.duo .k{display:flex;gap:8px;align-items:center;min-width:0}
.duo .k b{display:block;font-weight:600}
.duo .k span{font-size:12px;color:var(--muted)}
.duo .vs{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px}
.raisons{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0}
.pill.conflit,.pill.ko{background:var(--ko-bg);color:var(--ko);border-color:transparent}
.pill.incertain,.pill.doute{background:var(--doute-bg);color:var(--doute);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ko{border-color:var(--ko);color:var(--ko)}
.btn.doute{border-color:var(--doute);color:var(--doute)}
.btn.actif.ok{background:var(--ok);color:var(--surface)}
.btn.actif.ko{background:var(--ko);color:var(--surface)}
.btn.actif.doute{background:var(--doute);color:var(--surface)}
.btn.plein{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lien{border:0;background:none;color:var(--muted);text-decoration:underline;padding-inline:4px}
.btn[disabled]{opacity:.5;cursor:default}
.vide-etat{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;max-width:70ch}

/* Suivi */
.compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.compteurs div{background:var(--surface);padding:12px 14px}
.compteurs b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.compteurs span{font-size:12px;color:var(--muted)}
.compteurs .ko b{color:var(--ko)} .compteurs .ok b{color:var(--ok)} .compteurs .doute b{color:var(--doute)}
.bloc-club{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.bloc-club>header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bloc-club>header img{width:34px;height:34px;object-fit:contain}
.bloc-club>header h3{font-size:22px}
.bloc-club .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px;flex:1;min-width:180px}
.bloc-club .meta b{color:var(--ink);font-weight:500}
.tbox{overflow-x:auto}
table.suivi{border-collapse:collapse;width:100%;min-width:680px}
table.suivi th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 14px 6px}
table.suivi td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.suivi td.t{display:flex;gap:10px;align-items:center;font-weight:600}
table.suivi td small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.suivi tr.attendu td{color:var(--muted)}

/* Dossier */
.fil{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.dossier{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"bat coul" "part part" "valid hist";gap:16px;align-items:start}
.z-bat{grid-area:bat}.z-coul{grid-area:coul}.z-part{grid-area:part}.z-valid{grid-area:valid}.z-hist{grid-area:hist}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.carte>h3{font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:contents}
.bat{background:var(--planche);border:1px solid var(--planche-line);border-radius:6px;overflow:auto;max-height:560px;display:grid;place-items:center;min-height:120px;color:#5a6573;font-size:13px;padding:6px}
.bat canvas{max-width:100%;height:auto;cursor:crosshair;display:block}
.versions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.versions li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.versions b{font-family:var(--mono);font-weight:500}
.rang{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.champ{display:flex;align-items:center;justify-content:space-between;gap:10px}
.champ.v{flex-direction:column;align-items:stretch;gap:3px}
.champ.v>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],textarea,select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=color]{width:46px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;flex:none}
.apercu-tenue{background:var(--planche);border:1px solid var(--planche-line);border-radius:6px;padding:10px;display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px;align-items:center;justify-items:center}
.apercu-tenue canvas{max-width:100%;height:auto;max-height:150px}
table.cdc{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
table.cdc th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:4px 6px}
table.cdc td{padding:3px 6px;border-top:1px solid var(--line)}
table.cdc td.e{white-space:nowrap;font-weight:500}
table.cdc input,table.cdc select{padding:4px 6px}
table.cdc td:nth-child(2){min-width:170px}table.cdc td:nth-child(3),table.cdc td:nth-child(4){min-width:150px}
table.cdc .dim{display:flex;gap:4px;align-items:center}
table.cdc .dim input{width:56px}
table.cdc .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.cdc tr.zone td{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bilan{display:flex;flex-direction:column;gap:6px}
.bilan ul{margin:0;padding-left:18px;color:var(--ko)}
.valid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.valid section{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.valid h4{font-size:17px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mail{border:1px solid var(--accent);background:var(--accent-bg);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mail textarea{min-height:170px;font-size:13px}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.journal li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px}
.journal time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
details img{margin-top:8px;border:1px solid var(--planche-line);border-radius:4px;background:#fff}

/* Dialogue */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,12,18,.55)}
.fiche{padding:20px;display:flex;flex-direction:column;gap:16px}
.fiche h3{font-size:26px;text-transform:uppercase}
.fiche .faces{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.face{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.face img{height:130px;max-width:100%;object-fit:contain}
.face b{font-weight:600;text-align:center}
.face span{font-size:12px;color:#5a6573;text-align:center}
.face .chips{border:0;padding:0;justify-content:center}
.jauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok-bg) 0 var(--b1),var(--doute-bg) var(--b1) var(--b2),var(--ko-bg) var(--b2) 100%);border:1px solid var(--line)}
.jauge i{position:absolute;top:-5px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.faits{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.faits dt{color:var(--muted)}
.faits dd{margin:0}
.fiche .actions{justify-content:flex-start}
.fiche footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}

/* Générateur */
.gen{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.panneau{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panneau fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.panneau legend{font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:0;margin-bottom:4px}
.panneau .champ select{max-width:190px}
.planche{background:var(--planche);color:var(--planche-ink);border:1px solid var(--planche-line);border-radius:8px;padding:18px;display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:14px;align-items:center;justify-items:center}
.planche canvas{max-width:100%;height:auto;max-height:340px}
.planche figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.planche figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#5a6573}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:900px){ .dossier{grid-template-columns:minmax(0,1fr);grid-template-areas:"bat" "coul" "part" "valid" "hist"} }
@media (max-width:720px){
  .club{grid-template-columns:1fr}
  .club .id{flex-direction:row;align-items:center}
  .gen{grid-template-columns:1fr}
  .ligne{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .sync{display:none}
}
@media (max-width:420px){
  .cell{width:50px;height:42px}
  .thumb{width:40px;height:40px}
  .fiche .faces{grid-template-columns:1fr}
  .planche{grid-template-columns:1fr}
  .journal li{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:no-preference){ .cell,.btn,.pick{transition:filter .12s,background-color .12s} }

/* Connexion, bandeau de session */
.session{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-block:8px 0}
.session input{width:150px;padding:4px 8px}
.connexion{max-width:380px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.connexion h2{font-size:26px;text-transform:uppercase}
.connexion .err{color:var(--ko);margin:0;font-size:13px}
.bandeau{background:var(--doute-bg);color:var(--doute);border-radius:6px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.pastille{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);padding:0}
.pied{color:var(--muted);font-size:12px;padding-block:0 28px}
</style>
</head>
<body>
<header class="wrap top">
  <div>
    <div class="eyebrow" id="saison">LNR · Saison 2026-2027</div>
    <h1>Tenues de jeu</h1>
  </div>
  <div class="seg" role="group" aria-label="Championnat" id="seg-comp"></div>
  <ul class="stats" id="stats" aria-label="Chiffres de la saison"></ul>
</header>
<div class="wrap session" id="session" hidden>
  <label for="moi">Votre prénom, pour l'historique</label><input type="text" id="moi" maxlength="30" autocomplete="given-name">
  <button class="btn petit" id="b-actualiser">Actualiser</button>
  <button class="btn petit" id="b-deconnexion" hidden>Se déconnecter</button>
</div>

<nav class="tabs" aria-label="Rubriques">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-view="suivi" id="tab-suivi">Suivi</button>
    <button class="tab" role="tab" data-view="rencontres" id="tab-rencontres">Rencontres</button>
    <button class="tab" role="tab" data-view="a-trancher" id="tab-a-trancher">À trancher<span class="n" id="n-trancher" hidden></span></button>
    <button class="tab" role="tab" data-view="tenues" id="tab-tenues">Tenues</button>
    <button class="tab" role="tab" data-view="visuels" id="tab-visuels">Visuels</button>
    <span class="sync" id="sync">Chargement…</span>
  </div>
</nav>

<main class="wrap" id="main"><p class="vide-etat">Chargement des tenues de la saison…</p></main>

<footer class="wrap pied">Tenues de jeu LNR · V0.2.0</footer>
<dialog id="fiche" aria-labelledby="fiche-titre"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="commun.js"></script>
<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LIB={ok:"Compatible",ko:"À éviter",doute:"À vérifier"}, SYM={ok:"✓",ko:"✕",doute:"?"};
const COMPS=["TOP 14","PRO D2"], ATTENDU={"TOP 14":3,"PRO D2":2}, TYPES=["Domicile","Extérieur","Third"], SUFF=["dom","ext","third"];
const PIXEL="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

let D=null, clubs={}, kits={}, decisions={}, dbTenues={}, dbClubs={};
let store=null, monId="", connecte=false, liens={};
const lecture=false;
const etat={view:"suivi",comp:"TOP 14",mode:"club",club:null,j:1,filtre:"tous",fiche:null,tenue:null,dlg:null,mail:null};
let brouillon=null, modifie=false, apercu=null, pipette="m1";
try{const m=localStorage.getItem("tenues.mode"); if(m==="club"||m==="journee") etat.mode=m; const c=localStorage.getItem("tenues.comp"); if(COMPS.includes(c)) etat.comp=c;}catch(e){}

const dateFr=(iso,h)=>{const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+(h?" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"");};
const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const qui=x=>typeof x==="string"?x:"";
const {num,fmt,EMPL,ZONES,CDC,controle,DEFAUT,MOTIF_LIB,MOTIFS,GAB,image,chargerGabarits,peindre,detecter,alleger,rasteriser,nettoyerPubs}=window.LNR;

/* ---------- Cahier des charges publicités (repris du formulaire 2026-2027) ---------- */

/* ---------- Modèle : catalogue 2026-2027 + ce qui est saisi sur la plateforme ---------- */
function listeClubs(comp){
  const out=[];
  for(const c of D.clubs) out.push(Object.assign({statique:true},c,dbClubs[c.id]||{},{id:c.id,nom:c.nom,court:c.court,comp:c.comp}));
  for(const id in dbClubs){ if(D.clubs.some(c=>c.id===id)) continue; const c=dbClubs[id]; if(!c.nom) continue; out.push(Object.assign({court:c.nom,comp:"PRO D2"},c,{id})); }
  return comp?out.filter(c=>c.comp===comp):out;
}
const clubDe=id=>listeClubs().find(c=>c.id===id);
function tenuesDe(club){
  const stat=(D.clubs.find(c=>c.id===club.id)||{tenues:[]}).tenues, out=[], vus={};
  stat.forEach((k,i)=>{out.push({id:k.id,club:club.id,type:k.type,ordre:i,statique:k,doc:dbTenues[k.id]||{}}); vus[k.id]=1;});
  for(const id in dbTenues){const d=dbTenues[id]; if(d.club!==club.id||vus[id]) continue; out.push({id,club:club.id,type:d.type||"Tenue",ordre:d.ordre==null?9:d.ordre,doc:d}); vus[id]=1;}
  const n=ATTENDU[club.comp]||2;
  for(let i=0;i<n;i++){ if(out.some(t=>t.ordre===i)) continue; const id=club.id+"."+SUFF[i]; if(vus[id]) continue; out.push({id,club:club.id,type:TYPES[i],ordre:i,doc:{},attendu:true}); }
  return out.sort((a,b)=>a.ordre-b.ordre);
}
function trouverTenue(id){ for(const c of listeClubs()){const t=tenuesDe(c).find(t=>t.id===id); if(t) return {T:t,C:c};} return null; }
const versions=T=>T.doc.versions||[];
function statutDesign(T){ const s=T.doc.design&&T.doc.design.statut; if(s) return s; if(T.statique&&!versions(T).length) return "repris"; return versions(T).length?"recu":"attendu"; }
function aPubs(T){const p=T.doc.pubs||{}; return Object.keys(p).some(k=>p[k]&&(p[k].nom||num(p[k].l)));}
function statutPart(T){ const s=T.doc.part&&T.doc.part.statut; if(s) return s; if(aPubs(T)) return "controler"; if(versions(T).length) return "saisir"; return T.statique?"nonsaisi":"attendu"; }
const PILL={attendu:["","Non reçu"],recu:["info","Reçu, à examiner"],repris:["ok","Validé · repris du catalogue"],valide:["ok","Validé"],corriger:["ko","À corriger"],controler:["info","À contrôler"],saisir:["doute","Partenaires à saisir"],nonsaisi:["","Non saisi"]};
const pill=s=>`<span class="pill ${PILL[s][0]}">${PILL[s][1]}</span>`;

/* Reconstruit les clubs et tenues utilisés par le calcul de compatibilité. */
function reconstruire(){
  clubs={}; kits={};
  for(const c of D.clubs){
    const C=Object.assign({},c,{tenues:c.tenues.slice()});
    for(const id in dbTenues){const d=dbTenues[id];
      if(d.club!==c.id||c.tenues.some(k=>k.id===id)) continue;
      if(!(d.design&&d.design.statut==="valide"&&d.couleurs&&d.couleurs.m1)) continue;
      const co=d.couleurs;
      C.tenues.push({id,type:d.type||"Tenue",couleur:co.nom||"saisie sur la plateforme",genere:true,couleurs:co,
        maillot:{img:vignette("maillot",co),pal:palDe(co)},short:{img:vignette("short",co)},chaussettes:{img:vignette("chaussettes",co)}});
    }
    clubs[c.id]=C; for(const k of C.tenues){k.club=c.id; kits[k.id]=k;}
  }
}

/* ---------- Couleurs ---------- */
function lab(hex){
  const h=hex.replace("#",""), f=i=>{let v=parseInt(h.substr(i,2),16)/255; return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  const r=f(0),g=f(2),b=f(4), x=(.4124*r+.3576*g+.1805*b)/.95047, y=.2126*r+.7152*g+.0722*b, z=(.0193*r+.1192*g+.9505*b)/1.08883;
  const t=v=>v>.008856?Math.cbrt(v):7.787*v+16/116; return [116*t(y)-16,500*(t(x)-t(y)),200*(t(y)-t(z))];
}
function palDe(c){
  const w={uni:[1],manches:[.8,.2],hautbas:[.42,.58]}[c.motif]||[.5,.5], cols=(c.motif||"uni")==="uni"?[c.m1]:[c.m1,c.m2||c.m1];
  return cols.map((h,i)=>({hex:h,w:w[i],lab:lab(h)}));
}
function proximite(a,b){
  const pa=a.maillot.pal, pb=b.maillot.pal, A=D.algo;
  const wa=pa.reduce((s,q)=>s+q.w,0), wb=pb.reduce((s,q)=>s+q.w,0); let s=0;
  for(const x of pa) for(const y of pb){
    const d2=(x.lab[0]-y.lab[0])**2 + A.alpha*((x.lab[1]-y.lab[1])**2+(x.lab[2]-y.lab[2])**2);
    s+=(x.w/wa)*(y.w/wb)*Math.exp(-d2/(A.tau*A.tau));
  }
  return s;
}
function niveauCalcul(s){const A=D.algo; return s>A.seuil+A.bande?"ko":s<A.seuil-A.bande?"ok":"doute";}
const cle=(a,b)=>a<b?a+"~"+b:b+"~"+a;
function verdict(ida,idb){
  const k=cle(ida,idb), a=kits[ida], b=kits[idb], s=proximite(a,b), calc=niveauCalcul(s);
  const ref=D.reference[k], dec=decisions[k];
  const refV=!ref?null:ref==="conflit"?"doute":ref.slice(0,2);
  const raisons=[];
  if(ref==="conflit") raisons.push("conflit");
  if(ref==="ok?"||ref==="ko?") raisons.push("incertain");
  if(refV&&refV!=="doute"&&calc!=="doute"&&calc!==refV) raisons.push("ecart");
  if(!ref&&calc==="doute") raisons.push("nouvelle");
  let v,src;
  if(dec){v=dec.v;src="decision";} else if(refV){v=refV;src="document";} else {v=calc;src="calcul";}
  return {k,v,src,s,calc,ref,refV,raisons,dec,aTrancher:!dec&&raisons.length>0,incertain:!dec&&(ref==="ok?"||ref==="ko?")};
}
function toutesPaires(){
  const ids=Object.keys(kits).filter(i=>clubs[kits[i].club].comp===etat.comp), out=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ if(kits[ids[i]].club===kits[ids[j]].club) continue; out.push(verdict(ids[i],ids[j])); }
  return out;
}

/* ---------- Gabarits recolorés ---------- */
const GEN={m1:"#f2c400",m2:"#12213f",motif:"cercle",s1:"#12213f",c1:"#f2c400",c2:"#12213f"};
const PRESETS=[["Rouge uni",{m1:"#d90f0f",m2:"#d90f0f",motif:"uni",s1:"#d90f0f",c1:"#d90f0f",c2:"#d90f0f"}],
  ["Jaune et marine cerclé",{m1:"#f2c400",m2:"#12213f",motif:"cercle",s1:"#12213f",c1:"#f2c400",c2:"#12213f"}],
  ["Ciel et blanc bicolore",{m1:"#7fb2e8",m2:"#ffffff",motif:"hautbas",s1:"#ffffff",c1:"#ffffff",c2:"#7fb2e8"}],
  ["Blanc et grenat en quartiers",{m1:"#ffffff",m2:"#5a1730",motif:"quartiers",s1:"#ffffff",c1:"#ffffff",c2:"#5a1730"}],
  ["Noir, manches rouges",{m1:"#16181c",m2:"#c8102e",motif:"manches",s1:"#16181c",c1:"#16181c",c2:"#c8102e"}],
  ["Vert et blanc rayé",{m1:"#0d4a33",m2:"#ffffff",motif:"vertical",s1:"#0d4a33",c1:"#0d4a33",c2:"#ffffff"}]];
const vigCache={};
function vignette(part,co){
  if(!co||!co.m1) return PIXEL;
  const k=part+"|"+[co.m1,co.m2,co.motif,co.s1,co.c1,co.c2].join(",");
  if(vigCache[k]) return vigCache[k];
  if(!GAB.pret){ chargerGabarits().then(()=>{reconstruire(); rendre();}).catch(()=>{}); return PIXEL; }
  const cv=document.createElement("canvas"); peindre(cv,part,co);
  try{ return vigCache[k]=cv.toDataURL("image/png"); }catch(e){ return PIXEL; }
}
function dessiner(prefixe,co){ if(!GAB.pret) return; for(const p of ["maillot","short","chaussettes"]){const cv=$("#"+prefixe+p); if(cv) peindre(cv,p,co);} }

/* ---------- Petits rendus ---------- */
const abr=t=>t==="Domicile"?"Dom.":t==="Extérieur"?"Ext.":t;
const thumb=k=>`<span class="thumb"><img src="${k.maillot.img}" alt="" loading="lazy"></span>`;
function thumbT(T){
  if(T.statique) return `<span class="thumb"><img src="${T.statique.maillot.img}" alt="" loading="lazy"></span>`;
  if(T.doc.couleurs&&T.doc.couleurs.m1) return `<span class="thumb"><img src="${vignette("maillot",T.doc.couleurs)}" alt=""></span>`;
  return `<span class="thumb">${versions(T).length?"BAT":"—"}</span>`;
}
function cellule(row,col){
  const v=verdict(row.id,col.id);
  const cls=["cell",v.v,v.incertain?"incertain":"",v.src==="decision"?"tranche":""].join(" ");
  const l=`${clubs[row.club].court} ${row.type} contre ${clubs[col.club].court} ${col.type} : ${LIB[v.v]}`;
  return `<td><button class="${cls}" data-a="${row.id}" data-b="${col.id}" aria-label="${esc(l)}" title="${esc(l)}">${SYM[v.v]}${v.incertain?"?":""}</button></td>`;
}
function matrice(V,R){
  return `<div class="mx-box"><table class="mx"><thead><tr><th class="coin">${esc(R.court)} →<br>${esc(V.court)} ↓</th>${R.tenues.map(k=>`<th scope="col"><span class="kh">${thumb(k)}<span class="kitcap">${esc(k.type)}</span></span></th>`).join("")}</tr></thead>
  <tbody>${V.tenues.map(r=>`<tr><th scope="row"><span class="kh"><span class="kitcap" title="${esc(r.type)}">${esc(abr(r.type))}</span>${thumb(r)}</span></th>${R.tenues.map(c=>cellule(r,c)).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function conseil(V,R){
  const dom=R.tenues[0], okk=V.tenues.filter(t=>verdict(t.id,dom.id).v==="ok").map(t=>t.type);
  return okk.length?`<p class="conseil">Si ${esc(R.court)} joue en ${esc(dom.type)} : <b>${okk.map(esc).join(", ")}</b></p>`
    :`<p class="conseil vide">Si ${esc(R.court)} joue en ${esc(dom.type)} : <b>aucune tenue compatible</b></p>`;
}
function carteMatch(m,titre){const R=clubs[m.dom],V=clubs[m.ext]; return `<article class="match"><header><span class="j">J${m.j}</span><h3>${titre}</h3></header>${matrice(V,R)}${conseil(V,R)}</article>`;}
const legende=`<div class="legende">
  <span><span class="cell ok">✓</span>Compatible</span><span><span class="cell ko">✕</span>À éviter</span>
  <span><span class="cell doute">?</span>À vérifier</span><span><span class="cell ok incertain">✓?</span>Marqué incertain dans le document</span>
  <span><span class="cell ok tranche">✓</span>Tranché sur la plateforme</span><span>Cliquer une case ouvre la fiche de la paire.</span></div>`;
function chips(pal,max){return pal.slice(0,max||4).map(q=>`<span class="chip" title="${Math.round(q.w*100)} % de la surface"><i style="background:${q.hex}"></i><code>${q.hex.toUpperCase()}<br>${Math.round(q.w*100)} %</code></span>`).join("");}

/* ---------- Vue Suivi (dépôts et validations) ---------- */
function bilanClub(C){
  const ts=tenuesDe(C); let manq=0,corr=0;
  ts.forEach(T=>{ if(statutDesign(T)==="attendu") manq++; if(statutDesign(T)==="corriger"||statutPart(T)==="corriger") corr++; });
  return {ts,manq,corr};
}
function vueSuivi(){
  const cs=listeClubs(etat.comp); let tot=0,recu=0,val=0,corr=0,manq=0;
  const blocs=cs.map(C=>{
    const B=bilanClub(C);
    B.ts.forEach(T=>{tot++; const d=statutDesign(T),p=statutPart(T); if(d==="attendu") manq++; else recu++; if(d==="corriger"||p==="corriger") corr++; if((d==="valide"||d==="repris")&&p==="valide") val++;});
    const dr=(C.relances||[]).slice(-1)[0];
    const rows=B.ts.map(T=>{
      const vs=versions(T), v=vs[vs.length-1], d=statutDesign(T), p=statutPart(T), ct=aPubs(T)?controle(T.doc.pubs):null;
      const conf=!ct?`<span class="pill">—</span>`:ct.anomalies.length?`<span class="pill ko">${ct.anomalies.length} anomalie${ct.anomalies.length>1?"s":""}</span>`:`<span class="pill ok">Conforme · ${ct.n} pub${ct.n>1?"s":""}</span>`;
      return `<tr class="${d==="attendu"?"attendu":""}"><td class="t">${thumbT(T)}<span>${esc(T.type)}<small>${esc(T.statique?T.statique.couleur:(T.doc.couleurs&&T.doc.couleurs.nom)||"")}</small></span></td>
        <td>${v?`<b>V${v.n}</b><small>${dateFr(v.le)}</small>`:T.statique?`<small>Visuel du catalogue</small>`:`<small>Aucun BAT</small>`}</td>
        <td>${pill(d)}</td><td>${pill(p)}</td><td>${conf}</td>
        <td><button class="btn petit" data-ouvrir="${T.id}">${d==="attendu"&&!lecture?"Déposer":"Ouvrir"}</button></td></tr>`;}).join("");
    return `<section class="bloc-club"><header>${C.logo?`<img src="${C.logo}" alt="">`:""}<h3>${esc(C.nom)}</h3>
      <div class="meta"><span>Relances assurées par : <b>${esc(C.relancePar||"à désigner")}</b></span>${dr?`<span>Dernière relance : <b>${dateFr(dr.le)}</b>${qui(dr.par)?" par "+esc(qui(dr.par)):""}</span>`:""}</div>
      <div class="actions">${B.manq+B.corr?`<span class="pill ${B.corr?"ko":"doute"}">${B.manq?B.manq+" non reçue"+(B.manq>1?"s":""):""}${B.manq&&B.corr?" · ":""}${B.corr?B.corr+" à corriger":""}</span>`:""}
        ${lecture?"":`<button class="btn petit" data-lien="${C.id}">Lien club</button><button class="btn petit" data-relance="${C.id}">Relances</button><button class="btn petit" data-ajout-tenue="${C.id}">Ajouter une tenue</button>`}</div></header>
      <div class="tbox"><table class="suivi"><thead><tr><th>Tenue</th><th>BAT</th><th>Design</th><th>Partenaires</th><th>Cahier des charges</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join("");
  return `<div class="view-head"><div><h2>Suivi des dépôts</h2><p>Une ligne par tenue : le BAT reçu, la validation du design et celle des partenaires. ${ATTENDU[etat.comp]} tenues attendues par club en ${etat.comp}, davantage si le club en présente.</p></div>
    <div class="rang"><button class="btn" id="b-liens">Copier les liens des clubs</button><button class="btn" id="b-import">Importer des relevés</button><input type="file" id="f-releves" accept="application/json,.json" hidden><button class="btn" data-nouveau-club>Ajouter un club</button></div></div>
    <div class="compteurs"><div><b>${tot}</b><span>tenues attendues ou reçues</span></div><div><b>${recu}</b><span>reçues</span></div><div class="ok"><b>${val}</b><span>entièrement validées</span></div><div class="${corr?"ko":""}"><b>${corr}</b><span>à corriger</span></div><div class="${manq?"doute":""}"><b>${manq}</b><span>non reçues</span></div></div>
    ${blocs||`<p class="vide-etat">Aucun club de ${etat.comp} pour l'instant. Ajoutez un club pour ouvrir ses dépôts.</p>`}`;
}

/* ---------- Vue Dossier d'une tenue ---------- */
function ouvrirDossier(id){
  const r=trouverTenue(id); if(!r) return; const d=r.T.doc;
  etat.tenue=id; etat.view="dossier"; modifie=false; apercu=null;
  brouillon={couleurs:Object.assign({},DEFAUT,d.couleurs||{}),equip:Object.assign({nom:"",manches:"",short:"",maillot:""},d.equip||{}),pubs:JSON.parse(JSON.stringify(d.pubs||{})),aCouleurs:!!(d.couleurs&&d.couleurs.m1)};

async function chargerApercu(){
  const id=etat.tenue, r=trouverTenue(id); if(!r) return; const vs=versions(r.T), v=vs[vs.length-1]; if(!v) return;
  if(apercu&&apercu.asset===v.asset) return afficherApercu();
  try{ const blob=await store.lire(v.asset); const ras=await rasteriser(blob,"image/jpeg");
    if(etat.tenue!==id) return; apercu=Object.assign({asset:v.asset},ras); if(etat.view==="dossier") apresDossier();
  }catch(e){ const b=$("#bat"); if(b&&etat.tenue===id) b.textContent="L'image du BAT n'a pas pu être chargée."; }
}
function afficherApercu(){
  const b=$("#bat"); if(!b||!apercu||!apercu.canvas) return;
  const cv=document.createElement("canvas"); cv.width=apercu.canvas.width; cv.height=apercu.canvas.height; cv.getContext("2d").drawImage(apercu.canvas,0,0); cv.id="cv-bat"; cv.setAttribute("role","img"); cv.setAttribute("aria-label","BAT de la tenue");
  b.textContent=""; b.appendChild(cv); const z=$("#z-pipette"); if(z) z.hidden=false;
}
async function deposer(file){
  const id=etat.tenue, r=trouverTenue(id); if(!r||!file) return;
  let ras=null; try{ ras=await rasteriser(file,file.type); }catch(e){ return toast("Ce fichier n'a pas pu être lu. Déposez un PDF ou une image (PNG, JPEG, WebP)."); }
  toast("Dépôt du BAT en cours…");
  try{
    const vs=versions(r.T), n=(vs.length?vs[vs.length-1].n:0)+1, blob=await alleger(ras.canvas), chemin=`${D.saison}/${id}/v${n}-${Date.now()}.jpg`;
    await store.deposer(chemin,blob);
    apercu=Object.assign({asset:chemin},ras);
    await ecrireTenue(id,d=>{ d.versions=(d.versions||[]).concat([{n,asset:chemin,nom:file.name.slice(0,120),type:"image/jpeg",poids:blob.size,le:new Date().toISOString(),par:monId||null}]);
      if(d.design&&d.design.statut==="corriger") delete d.design; if(d.part&&d.part.statut==="corriger") delete d.part; },`BAT V${n} déposé (${file.name.slice(0,80)})`);
    toast(`BAT V${n} déposé : image allégée de ${Math.round(blob.size/1024)} Ko.`);
  }catch(e){
    apercu=Object.assign({asset:null},ras); apresDossier();
    toast("Le BAT n'a pas pu être enregistré. Il reste affiché pour cette session : réessayez dans un instant.");
  }
}

async function importerReleves(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(e){ return toast("Ce fichier n'est pas un fichier de relevés lisible."); }
  if(!d||d.format!=="lnr-tenues-lectures"||!Array.isArray(d.lectures)) return toast("Ce fichier n'est pas un export du Lecteur de BAT.");
  let n=0, ignores=0; const hex=h=>/^#[0-9a-f]{6}$/i.test(h||"");
  for(const l of d.lectures){
    const C=l&&clubDe(String(l.club||"")); if(!C){ ignores++; continue; }
    const suff=String(l.type||""), id=C.id+"."+suff; let r=trouverTenue(id);
    if(!r){ if(suff!=="third"&&!/^t\d$/.test(suff)){ ignores++; continue; } const ordre=suff==="third"?2:+suff.slice(1)-1; dbTenues[id]={club:C.id,comp:C.comp,type:ordre===2&&C.comp==="TOP 14"?"Third":"Tenue "+(ordre+1),ordre}; r=trouverTenue(id); if(!r){ ignores++; continue; } }
    const co=Object.assign({},DEFAUT,r.T.doc.couleurs||{}), lc=l.couleurs||{};
    for(const k of ["m1","m2","s1","c1","c2"]) if(hex(lc[k])) co[k]=lc[k].toLowerCase(); if(MOTIFS[lc.motif]) co.motif=lc.motif; if(typeof lc.nom==="string") co.nom=lc.nom.slice(0,60);
    const eq={nom:"",manches:"",short:"",maillot:""}; if(l.equip&&typeof l.equip==="object") for(const k in eq) eq[k]=String(l.equip[k]||"").slice(0,60);
    const pubs=nettoyerPubs(l.pubs&&typeof l.pubs==="object"?l.pubs:{}), np=Object.keys(pubs).length;
    await ecrireTenue(id,x=>{ x.couleurs=co; x.equip=eq; x.pubs=pubs; },`Relevé importé${l.fichier?" ("+String(l.fichier).slice(0,80)+")":""} : ${np} partenaire${np>1?"s":""}${l.verifie?"":", non vérifié dans le Lecteur"}${l.remarques?" · "+String(l.remarques).slice(0,300):""}`);
    n++;
  }
  toast(`${n} relevé${n>1?"s":""} importé${n>1?"s":""}${ignores?`, ${ignores} ignoré${ignores>1?"s":""} (club ou tenue inconnus)`:""}.`);
}

/* ---------- Stockage : Supabase, ou navigateur seul tant que le site n'est pas configuré ---------- */
function storeSupabase(url,cle){
  const sb=window.supabase.createClient(url,cle), ok=r=>{ if(r.error) throw r.error; return r.data; };
  return { mode:"supabase",
    async session(){ return ok(await sb.auth.getSession()).session; },
    async connecter(id,mdp){ ok(await sb.auth.signInWithPassword({email:id,password:mdp})); },
    async deconnecter(){ await sb.auth.signOut(); },
    async charger(){ const out={}; for(const t of ["decisions","clubs","tenues"]){ out[t]={}; for(let de=0;;de+=1000){ const rows=ok(await sb.from(t).select("id,data").order("id").range(de,de+999)); rows.forEach(r=>{out[t][r.id]=r.data;}); if(rows.length<1000) break; } } return out; },
    async ecrire(t,id,data){ ok(await sb.from(t).upsert({id,data,maj:new Date().toISOString()})); },
    async supprimer(t,id){ ok(await sb.from(t).delete().eq("id",id)); },
    async liens(){ const o={}; ok(await sb.from("liens").select("club_id,jeton").limit(1000)).forEach(r=>{o[r.club_id]=r.jeton;}); return o; },
    async definirLien(club,jeton){ ok(await sb.from("liens").upsert({club_id:club,jeton,maj:new Date().toISOString()})); },
    async deposer(chemin,blob){ ok(await sb.storage.from("bat").upload(chemin,blob,{contentType:"image/jpeg",upsert:false})); },
    async lire(chemin){ return ok(await sb.storage.from("bat").download(chemin)); } };
}
function storeLocal(){
  const CLE="tenues-lnr.demo", images={}; let base={decisions:{},clubs:{},tenues:{},liens:{}};
  try{ const b=JSON.parse(localStorage.getItem(CLE)||"null"); if(b&&b.tenues) base=Object.assign(base,b); }catch(_){ }
  const sauve=()=>{ try{localStorage.setItem(CLE,JSON.stringify(base));}catch(_){ } };
  return { mode:"local",
    async session(){ return {}; }, async connecter(){}, async deconnecter(){},
    async charger(){ try{ const b=JSON.parse(localStorage.getItem(CLE)||"null"); if(b&&b.tenues) base=Object.assign(base,b); }catch(_){ } return JSON.parse(JSON.stringify(base)); },
    async ecrire(t,id,data){ base[t][id]=JSON.parse(JSON.stringify(data)); sauve(); },
    async supprimer(t,id){ delete base[t][id]; sauve(); },
    async liens(){ return Object.assign({},base.liens); },
    async definirLien(club,jeton){ base.liens[club]=jeton; sauve(); },
    async deposer(chemin,blob){ images[chemin]=blob; },
    async lire(chemin){ if(!images[chemin]) throw new Error("absent"); return images[chemin]; } };
}

  try{
    const b=await store.charger();
    const t={}; for(const k in b.tenues){ const v=b.tenues[k]; if(v&&typeof v.club==="string") t[k]=sain(v); }
    try{ liens=await store.liens(); }catch(_){ liens={}; }
    if(etat.view==="dossier"&&etat.tenue&&dbTenues[etat.tenue]&&!t[etat.tenue]) t[etat.tenue]=dbTenues[etat.tenue];
    dbClubs=b.clubs||{}; dbTenues=t; reconstruire();
    const d2={}; for(const k in b.decisions){ const v=b.decisions[k], p=k.split("~"); if(v&&LIB[v.v]&&p.length===2&&kits[p[0]]&&kits[p[1]]) d2[k]={v:v.v,at:String(v.at||""),by:typeof v.by==="string"?v.by:null}; }
    decisions=d2;
    $("#sync").textContent=store.mode==="supabase"?"Données enregistrées dans la base":"Démonstration : données dans ce navigateur"; $("#sync").classList.toggle("on",store.mode==="supabase");
    if(annonce){ rendre(); toast("Données actualisées."); } else rendreSiLibre();
    if(etat.view==="dossier") chargerApercu();
  }catch(e){ $("#sync").textContent="Base injoignable"; $("#sync").classList.remove("on"); if(annonce) toast("Les données n'ont pas pu être actualisées."); }
}
function ecranConnexion(msg){
  $("#main").innerHTML=`<form class="connexion" id="f-connexion"><div><div class="eyebrow">Accès LNR</div><h2>Connexion</h2></div>
    <label class="champ v" for="c-id"><span>Identifiant</span><input type="text" id="c-id" autocomplete="username" required></label>
    <label class="champ v" for="c-mdp"><span>Mot de passe</span><input type="password" id="c-mdp" autocomplete="current-password" required style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%"></label>
    ${msg?`<p class="err">${esc(msg)}</p>`:""}<button class="btn plein" type="submit">Se connecter</button></form>`;
  $("#stats").innerHTML=""; $("#seg-comp").innerHTML=""; $("#sync").textContent="Non connecté";
  $("#f-connexion").addEventListener("submit",async e=>{ e.preventDefault(); const b=e.target.querySelector("button"); b.disabled=true;
    try{ await store.connecter($("#c-id").value.trim(),$("#c-mdp").value); ouvrir(); }
    catch(err){ ecranConnexion(/invalid|credentials/i.test(err&&err.message||"")?"Identifiant ou mot de passe incorrect.":"Connexion impossible. Vérifiez votre accès à Internet et réessayez."); } });
}
async function ouvrir(){
  connecte=true; $("#session").hidden=false; $("#b-deconnexion").hidden=store.mode!=="supabase"; $$(".tab").forEach(t=>t.hidden=false);
  try{ monId=localStorage.getItem("tenues.moi")||""; }catch(_){ } $("#moi").value=monId;
  reconstruire(); rendre(); await recharger(false); rendre();
  if(store.mode==="local"){ const m=$("#main"); m.insertAdjacentHTML("afterbegin",`<p class="bandeau">Mode démonstration : la base n'est pas encore configurée (fichier config.js). Les saisies restent dans ce navigateur et les images de BAT ne sont pas conservées.</p>`); }
}
async function demarrer(){
  try{ D=await (await fetch("data.json")).json(); }
  catch(e){ $("#main").innerHTML=`<p class="vide-etat">Les données de la saison n'ont pas pu être chargées. Rechargez la page.</p>`; $("#sync").textContent="Hors ligne"; return; }
  etat.club=D.clubs[0].id;
  const h=(location.hash||"").slice(1); if(["suivi","rencontres","a-trancher","tenues","visuels"].includes(h)) etat.view=h;
  const cfg=window.TENUES_CONFIG||{}, pret=/^https:\/\/.+/.test(cfg.SUPABASE_URL||"")&&(cfg.SUPABASE_ANON_KEY||"").length>20&&window.supabase;
  store=pret?storeSupabase(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):storeLocal();
  $$(".tab").forEach(t=>t.hidden=true);
  let s=null; try{ s=await store.session(); }catch(_){ }
  if(s) ouvrir(); else ecranConnexion("");
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&connecte&&store&&store.mode==="supabase"&&!modifie) recharger(false); });
demarrer();
})();
</script>
