<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Observatoire LNR</title>
<meta name="description" content="Observatoire LNR : évolution de l'utilisation des joueurs en TOP 14 et PRO D2.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brand-id">
        <img id="champLogo" src="/logos/top14.png" alt="TOP 14" width="56" height="56">
        <div>
          <h1>Observatoire <span id="spaceName">Effectifs</span></h1>
          <p id="scope">Utilisation des joueurs depuis 2013/14 · minutes, titularisations, âge, postes, nationalité</p>
        </div>
      </div>
      <div class="controls">
        <div class="seg alt" role="group" aria-label="Espace" id="spaceSeg"></div>
        <div class="seg" role="group" aria-label="Championnat" id="champSeg"></div>
        <label for="clubSel" class="count" style="display:none">Club</label>
        <select id="clubSel" aria-label="Club"></select>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
